name: weekly-retrain
on:
  schedule:
    - cron: "30 21 * * 1"   # Tuesday about 8:30am Sydney
  workflow_dispatch:
permissions:
  contents: write
concurrency: weekly-retrain
jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
      - name: Retrain (a refused model still gets recorded, then fails the job)
        id: retrain
        run: python -m retrain.weekly || echo "refused=1" >> "$GITHUB_OUTPUT"
      - run: python -m score.track_record
      - run: python -m score.export_site
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/artifacts model/registry.json data/rain out/track_record.json out/site.json out/backtest.json
          git diff --cached --quiet || (git commit -m "Weekly retrain $(date -u +%F)" && git pull --rebase && git push)
      - name: Fail if the new model was refused
        if: steps.retrain.outputs.refused == '1'
        run: exit 1
