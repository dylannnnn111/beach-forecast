name: log-forecasts
on:
  schedule:
    # Every two hours. Scheduled runs start hours late, and the feed only shows the latest forecast,
    # so frequent runs are the only way to catch the morning issue before it is reissued.
    - cron: "37 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: log-forecasts
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
      - run: python -m logger.log_forecasts
      - name: Refresh the page data (today's official forecast is now in the log)
        run: python -m score.track_record && python -m score.export_site
      - name: Commit new rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts
          git diff --cached --quiet && exit 0
          git add out/track_record.json out/site.json
          git commit -m "Forecast log $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done; exit 1
