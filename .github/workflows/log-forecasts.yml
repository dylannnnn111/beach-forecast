name: log-forecasts
on:
  schedule:
    - cron: "37 20 * * *"   # ~7:37am Sydney (AEDT), after the morning forecast
    - cron: "37 2 * * *"    # ~1:37pm Sydney, catches reissues
  workflow_dispatch:
permissions:
  contents: write
concurrency: log-forecasts
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
      - run: python -m logger.log_forecasts
      - name: Refresh the page data (today's official forecast is now in the log)
        run: python -m score.track_record && python -m score.export_site
      - name: Commit new rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts out/track_record.json out/site.json
          git diff --cached --quiet || (git commit -m "Forecast log $(date -u +%F)" && git pull --rebase && git push)
