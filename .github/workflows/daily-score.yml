name: daily-score
on:
  schedule:
    - cron: "10 20 * * *"   # 7:10am Sydney in summer, 6:10am in winter - always after the 6am cutoff
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-score
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
      - run: python -m score.daily
      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions
          git diff --cached --quiet || (git commit -m "Predictions $(date -u +%F)" && git pull --rebase && git push)
