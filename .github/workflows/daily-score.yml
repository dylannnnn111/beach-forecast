name: daily-score
on:
  schedule:
    # GitHub starts scheduled runs late - 5 to 8 hours late in this repo's first week - so there is an
    # attempt every hour across the Sydney morning. The first one after 6am Sydney time that reaches
    # Open-Meteo scores the day; the rest see it is done and stop. Rain after 6am is never used.
    - cron: "10 19-23,0-2 * * *"
    - cron: "10 4 * * *"   # last attempt: fails loudly if the day is still unscored
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-score
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
      - run: python -m score.daily ${{ github.event.schedule == '10 4 * * *' && '--strict' || '' }}
      - run: python -m score.track_record
      - run: python -m score.export_site
      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions
          git diff --cached --quiet && exit 0
          git add out/track_record.json out/site.json
          git commit -m "Predictions $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done; exit 1
